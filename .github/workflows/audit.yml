name: Audit pinned dependencies

# Weekly and on demand: checks the pinned Python dependencies (requirements.txt, including what they pull in) against the PyPI advisory
# database with pip-audit. A failure means "look at it and bump the pin"; it does not block image builds.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit requirements.txt
        run: |
          python3 -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet pip-audit
          /tmp/audit/bin/pip-audit --requirement requirements.txt --strict
